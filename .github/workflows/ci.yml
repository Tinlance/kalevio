name: KalevioAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: python -m pytest backend/tests/unit/ -v --tb=short --override-ini="asyncio_default_fixture_loop_scope=function"

      - name: Confirm test count
        run: echo "✅ KalevioAI CI passed"
